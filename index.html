ACTS.exportarCsv = async () => {
  const lancs = await buscarTudo(() => sb.from('fin_lancamentos').select('*').order('data').order('id'));
  const c = v => { const s = String(v ?? ''); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const linhas = [['Data','Tipo','Descrição','Categoria','Valor','Conta','Conta destino','Pessoal/Profissional','Observação'].join(';'),
    ...lancs.map(l => [fData(l.data), l.tipo, l.descricao, l.categoria, (l.tipo === 'despesa' ? '-' : '') + NUM2.format(l.valor).replace(/\./g, ''), nomeConta(l.conta_id), nomeConta(l.conta_destino_id), l.esfera, l.observacao].map(c).join(';'))];
  baixar('\ufeff' + linhas.join('\r\n'), `lancamentos-${hoje()}.csv`, 'text/csv');
  toast(lancs.length + ' lançamentos exportados');
};
function baixar(conteudo, nome, tipo){
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([conteudo], { type: tipo + ';charset=utf-8' })); a.download = nome;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
ACTS.ocultar = () => {
  S.oculto = !S.oculto; gravarLocal('cf-oculto', S.oculto); document.body.classList.toggle('oculto', S.oculto);
  document.querySelectorAll('[data-olho]').forEach(b => { b.innerHTML = ic(S.oculto ? 'olhoOff' : 'olho') + (b.closest('.side') ? `<span>${S.oculto ? 'Mostrar valores' : 'Ocultar valores'}</span>` : ''); b.setAttribute('aria-label', S.oculto ? 'Mostrar valores' : 'Ocultar valores'); });
  if (S.view === 'mais') renderMain();
};
ACTS.sair = async () => { await sb.auth.signOut(); S.user = null; S.pronto = false; telaLogin(); };
ACTS.trocarSenha = () => abrir(`<form class="modal" data-form="senha" novalidate><header><h2>Trocar senha</h2><button type="button" class="ic" data-act="fechar" aria-label="Fechar">${ic('fechar')}</button></header>
  <div class="corpo">${camposSenha()}<p class="erro" role="alert"></p></div><footer><button type="button" class="btn" data-act="fechar">Cancelar</button><button class="btn primario" type="submit">Salvar nova senha</button></footer></form>`);
const camposSenha = () => `<label class="campo" style="margin-bottom:12px"><span>Nova senha</span><input name="nova" type="password" autocomplete="new-password" minlength="8" required autofocus><small>Pelo menos 8 caracteres.</small></label>
  <label class="campo"><span>Repita a nova senha</span><input name="repete" type="password" autocomplete="new-password" required></label>`;
async function salvarSenha(fd){
  if ((fd.nova || '').length < 8) return 'A senha precisa ter pelo menos 8 caracteres.';
  if (fd.nova !== fd.repete) return 'As duas senhas não são iguais.';
  const { data, error } = await sb.auth.updateUser({ password: fd.nova, data: { trocar_senha: false } });
  if (error) return /different|same/i.test(error.message) ? 'A nova senha precisa ser diferente da atual.' : /weak|short|least/i.test(error.message) ? 'Senha fraca. Use pelo menos 8 caracteres, misturando letras e números.' : 'Não consegui trocar a senha: ' + error.message;
  if (data && data.user) S.user = data.user;
  return null;
}
FORMS.senha = async fd => { const e = await salvarSenha(fd); if (e) return e; fechar(); toast('Senha trocada'); };

/* ---------------- modal, toast, confirmação ---------------- */
const dlg = $('#dlg');
function abrir(html){
  if (!html.includes('data-form="impConfirmar"')) dlg.classList.remove('largo');
  dlg.innerHTML = html;
  // no celular, não abre o teclado sozinho
  if (!window.matchMedia('(min-width: 700px)').matches) dlg.querySelectorAll('[autofocus]').forEach(x => x.removeAttribute('autofocus'));
  if (!dlg.open) dlg.showModal();
  else { const f = dlg.querySelector('[autofocus]'); if (f) f.focus(); }
}
function fechar(){ if (dlg.open) dlg.close(); }
dlg.addEventListener('close', () => { if (!dlg.open) { dlg.innerHTML = ''; dlg.classList.remove('largo'); } });
dlg.addEventListener('mousedown', e => { if (e.target === dlg) { const r = dlg.getBoundingClientRect(); if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) fechar(); } });
let acaoConfirmar = null;
function confirmar(titulo, texto, botao, fn, perigo){
  acaoConfirmar = fn;
  abrir(`<form class="modal" data-form="confirmar" novalidate><header><h2>${titulo}</h2><button type="button" class="ic" data-act="fechar" aria-label="Fechar">${ic('fechar')}</button></header>
    <div class="corpo"><p style="margin:0">${texto}</p><p class="erro" role="alert"></p></div>
    <footer><button type="button" class="btn" data-act="fechar">Cancelar</button><button class="btn ${perigo ? 'perigo' : 'primario'}" type="submit" ${perigo ? 'style="border-color:var(--danger)"' : ''}>${botao}</button></footer></form>`);
}
FORMS.confirmar = async () => { const fn = acaoConfirmar; acaoConfirmar = null; fechar(); if (fn) await fn(); };
let toastT;
function toast(msg, ehErro){ const t = $('#toast'); t.textContent = msg; t.className = 'vis' + (ehErro ? ' erro' : ''); clearTimeout(toastT); toastT = setTimeout(() => t.className = '', ehErro ? 6000 : 3200); }
function traduzErro(e){
  const m = (e && (e.message || e.error_description || e.msg)) || String(e);
  if (/JWT|jwt|token/i.test(m)) return 'Sua sessão expirou. Entre de novo.';
  if (/Failed to fetch|NetworkError|network/i.test(m)) return 'Sem conexão com o servidor. Verifique a internet e tente de novo.';
  if (/duplicate key/i.test(m)) return 'Esse registro já existe.';
  if (/violates check constraint/i.test(m)) return 'Algum valor está fora do permitido. Confira os campos.';
  if (/violates foreign key/i.test(m)) return 'Esse item está ligado a outro registro e não pode ser alterado assim.';
  return m;
}
function erro(e){ console.error(e); const msg = traduzErro(e); toast(msg, true); if (/sessão expirou/.test(msg)) setTimeout(() => ACTS.sair(), 1500); }

/* ---------------- eventos ---------------- */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = ACTS[el.dataset.act] || (el.dataset.act === 'fechar' ? fechar : null); if (!fn) return;
  if (el.tagName === 'INPUT' && el.type === 'checkbox') { fn(el.dataset, el); return; }
  e.preventDefault(); e.stopPropagation();
  try { await fn(el.dataset, el); } catch (err) { erro(err); }
});
ACTS.filtro = ({ k, v }) => { S.f[k] = v === 'true' ? true : v === 'false' ? false : /^\d+$/.test(v) ? Number(v) : v; renderMain(); };
ACTS.copiar = async ({ txt }) => { try { await navigator.clipboard.writeText(txt); toast('Código copiado'); } catch { toast('Não consegui copiar. Selecione e copie manualmente.', true); } };
let tBusca;
document.addEventListener('input', e => {
  const el = e.target.closest('[data-f]'); if (!el || el.tagName !== 'INPUT') return;
  clearTimeout(tBusca); tBusca = setTimeout(() => { S.f[el.dataset.f] = el.value; renderMain(); }, 220);
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.matches('select[data-f]')) { S.f[el.dataset.f] = el.value; renderMain(); }
  if (el.matches('input[type=checkbox][data-f]')) { S.f[el.dataset.f] = el.checked; renderMain(); }
  if (el.matches('[data-act-change=tipoConta]')) aoMudarTipoConta(el);
});
document.addEventListener('submit', async e => {
  const form = e.target.closest('form[data-form]'); if (!form) return;
  e.preventDefault();
  const fn = FORMS[form.dataset.form]; if (!fn) return;
  const btn = form.querySelector('[type=submit]'); const errEl = form.querySelector('.erro');
  if (btn) btn.disabled = true; if (errEl) errEl.textContent = '';
  try {
    const msg = await fn(Object.fromEntries(new FormData(form)), form);
    if (msg && errEl) errEl.textContent = msg;
  } catch (err) {
    console.error(err);
    if (errEl && form.isConnected) errEl.textContent = traduzErro(err); else erro(err);
  } finally { if (btn && btn.isConnected) btn.disabled = false; }
});

/* ---------------- login ---------------- */
function telaLogin(msg){
  fechar();
  document.body.classList.remove('oculto');
  $('#app').innerHTML = `<div class="login"><form class="login-card" data-form="login" novalidate>
    <div class="marca">${LOGO}<div><b>Central Financeira</b><span>Acesso restrito</span></div></div>
    <h1>Entrar</h1>
    <label class="campo"><span>E-mail</span><input name="email" type="email" autocomplete="username" required autofocus></label>
    <label class="campo"><span>Senha</span><input name="senha" type="password" autocomplete="current-password" required></label>
    <p class="erro" role="alert">${esc(msg || '')}</p>
    <button class="btn primario largo" type="submit">Entrar</button>
    <p class="nota">Seus dados só aparecem depois do login, e ficam salvos neste aparelho até você sair.</p>
  </form></div>`;
}
FORMS.login = async fd => {
  if (!fd.email || !fd.senha) return 'Informe e-mail e senha.';
  const { data, error } = await sb.auth.signInWithPassword({ email: fd.email.trim(), password: fd.senha });
  if (error) return /invalid/i.test(error.message) ? 'E-mail ou senha incorretos.' : /rate|many/i.test(error.message) ? 'Muitas tentativas. Espere alguns minutos e tente de novo.' : traduzErro(error);
  S.user = data.user;
  await entrar();
};
function telaNovaSenha(){
  $('#app').innerHTML = `<div class="login"><form class="login-card" data-form="primeiraSenha" novalidate>
    <div class="marca">${LOGO}<div><b>Central Financeira</b><span>Primeiro acesso</span></div></div>
    <h1>Crie sua senha</h1>
    <p class="muted" style="margin:-6px 0 16px;font-size:14px">A senha temporária vale só para este primeiro acesso. Escolha uma que só você saiba.</p>
    ${camposSenha()}
    <p class="erro" role="alert"></p>
    <button class="btn primario largo" type="submit">Salvar e entrar</button>
  </form></div>`;
}
FORMS.primeiraSenha = async fd => { const e = await salvarSenha(fd); if (e) return e; toast('Senha criada'); await entrar(); };
async function entrar(){
  if (S.user && S.user.user_metadata && S.user.user_metadata.trocar_senha) return telaNovaSenha();
  $('#app').innerHTML = '<div class="carregando">Carregando suas finanças…</div>';
  try { await carregar(); montarApp(); }
  catch (e) { console.error(e); telaLogin(traduzErro(e)); }
}
sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_OUT' && S.user) { S.user = null; S.pronto = false; telaLogin('Você saiu. Entre de novo para continuar.'); } });
(async () => {
  try {
    const { data } = await sb.auth.getSession();
    if (!data.session) return telaLogin();
    S.user = data.session.user;
    await entrar();
  } catch (e) { console.error(e); telaLogin(traduzErro(e)); }
})();
</script>
