<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Central Financeira</title>
<meta name="description" content="Gestão financeira pessoal: contas a pagar, bancos, dívidas e análise.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0e2740">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Finanças">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#f1f4f7; --surface:#ffffff; --surface-2:#f6f8fa; --surface-3:#eaf0f4;
  --ink:#0f2a43; --ink-2:#36506b; --muted:#5a6f84; --line:#d9e2e9; --line-2:#e8eef2;
  --navy:#0e2740; --navy-2:#173a5d; --on-navy:#eaf1f7; --on-navy-2:#9fb5ca;
  --teal:#00796b; --teal-hover:#00695d; --on-teal:#ffffff; --teal-ink:#00695d; --teal-tint:#e0f2ef;
  --gold:#c8861b; --gold-ink:#7d5208; --gold-tint:#fbf0db;
  --rec:#00897b; --desp:#c8861b;
  --danger:#b42318; --danger-tint:#fdeceb; --ok:#0a7a3a; --ok-tint:#e3f4e9;
  --focus:#1b6fd1;
  --r-lg:16px; --r:12px; --r-sm:8px;
  --font:'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --bg:#0b1520; --surface:#14212e; --surface-2:#192837; --surface-3:#1f3142;
    --ink:#e7eef5; --ink-2:#b8c7d6; --muted:#8fa2b5; --line:#263a4d; --line-2:#1f3141;
    --navy:#081420; --navy-2:#13293f; --on-navy:#e7eef5; --on-navy-2:#8fa2b5;
    --teal:#1aa59e; --teal-hover:#22b8b0; --on-teal:#03201e; --teal-ink:#5cc9c1; --teal-tint:#123a3a;
    --gold:#c08316; --gold-ink:#e0b25c; --gold-tint:#3a2c12;
    --rec:#1aa59e; --desp:#c08316;
    --danger:#f07a6c; --danger-tint:#3b1d1b; --ok:#4cc27e; --ok-tint:#16331f;
    --focus:#6aa8f0;
  }
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--teal-ink)}
h1,h2,h3{margin:0;line-height:1.25}
h1{font-size:24px;font-weight:600;letter-spacing:-.01em}
h2{font-size:16px;font-weight:600}
.num,.money{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.oculto .money{filter:blur(7px);user-select:none}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- estrutura ---------- */
.app{min-height:100vh}
.side{display:none}
.so-desktop{display:none !important}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 16px;padding-top:max(10px, env(safe-area-inset-top));background:var(--navy);color:var(--on-navy)}
.top .marca{flex:1}
main{padding:20px 16px 110px;max-width:1180px;margin:0 auto}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.bottom a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 7px;font-size:11px;color:var(--muted);text-decoration:none;position:relative}
.bottom a.ativo{color:var(--teal-ink);font-weight:600}
.bottom a .badge{position:absolute;top:4px;left:calc(50% + 6px)}
.fab{position:fixed;right:16px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:21;width:56px;height:56px;border-radius:18px;border:0;background:var(--teal);color:var(--on-teal);display:grid;place-items:center;cursor:pointer;box-shadow:0 6px 18px rgba(0,60,55,.28)}
.fab svg.i{width:26px;height:26px;stroke-width:2.2}
.marca{display:flex;align-items:center;gap:10px;min-width:0}
.modos{display:flex;gap:2px;padding:3px;border-radius:10px;background:rgba(255,255,255,.1)}
.side .modos{margin:0 8px 16px}
.modos button{flex:1;border:0;border-radius:8px;padding:7px 8px;background:transparent;color:inherit;font:inherit;font-size:13px;cursor:pointer;opacity:.75}
.modos button.ativo{background:#fff;color:var(--navy);opacity:1;font-weight:600}
.top .modos button{padding:6px 7px;font-size:12px}
.escolha-modo{max-width:640px;margin:8vh auto 0;text-align:center}
.escolha-modo h1{margin:0 0 6px}
.escolha-modo p{margin:0 0 24px;color:var(--muted,#667)}
.cartoes-modo{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}
@media (max-width:560px){.cartoes-modo{grid-template-columns:1fr}}
.cartoes-modo button{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:22px;border-radius:16px;border:1px solid var(--line,#dde);background:var(--card,#fff);color:inherit;font:inherit;cursor:pointer}
.cartoes-modo button:hover{border-color:var(--navy)}
.cartoes-modo button b{font-size:20px}
.cartoes-modo button span{font-size:14px;opacity:.75}
.cartoes-modo .i{width:28px;height:28px}
.marca b{display:block;font-size:15px;font-weight:600;line-height:1.2}
.marca span{display:block;font-size:12px;color:var(--on-navy-2);line-height:1.2}
.logo{width:34px;height:34px;flex:none}
.ic{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:10px;border:0;background:transparent;color:inherit;cursor:pointer}
.ic:hover{background:rgba(127,150,170,.14)}
.badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--danger);color:#fff;font-size:11px;font-weight:600;display:inline-grid;place-items:center;line-height:1}

@media (min-width:900px){
  .app{display:grid;grid-template-columns:236px 1fr}
  .side{display:flex;flex-direction:column;position:sticky;top:0;height:100vh;background:var(--navy);color:var(--on-navy);padding:20px 12px}
  .side .marca{padding:0 8px 22px}
  .side nav{display:flex;flex-direction:column;gap:2px}
  .side nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--on-navy-2);text-decoration:none;font-weight:500}
  .side nav a:hover{background:var(--navy-2);color:var(--on-navy)}
  .side nav a.ativo{background:var(--navy-2);color:var(--on-navy)}
  .side nav a.ativo svg{color:#7fd3c9}
  .side nav a .badge{margin-left:auto}
  .side .rodape{margin-top:auto;display:flex;flex-direction:column;gap:2px}
  .side .rodape button{display:flex;align-items:center;gap:12px;padding:10px 12px;border:0;border-radius:10px;background:transparent;color:var(--on-navy-2);cursor:pointer;text-align:left;font-weight:500}
  .side .rodape button:hover{background:var(--navy-2);color:var(--on-navy)}
  .top,.bottom{display:none}
  .so-desktop{display:flex !important}
  main{padding:32px 36px 60px}
  .fab{display:none}
}

/* ---------- componentes ---------- */
.cab{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
.cab p{margin:2px 0 0;color:var(--muted)}
.cab .acoes{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:8px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:500;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn svg.i{width:18px;height:18px}
.btn.primario{background:var(--teal);border-color:var(--teal);color:var(--on-teal)}
.btn.primario:hover{background:var(--teal-hover)}
.btn.perigo{color:var(--danger);border-color:transparent;background:transparent}
.btn.perigo:hover{background:var(--danger-tint)}
.btn.peq{min-height:34px;padding:5px 12px;font-size:14px}
.btn.largo{width:100%}
.btn-pagar svg.i{width:16px;height:16px;stroke-width:2.2;color:var(--muted)}
.btn[disabled]{opacity:.55;cursor:default}
.link{border:0;background:none;padding:0;color:var(--teal-ink);font-weight:500;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}
.card>.card-cab{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px 6px}
.card>.card-corpo{padding:8px 18px 18px}
.vazio{padding:28px 18px;text-align:center;color:var(--muted)}
.vazio .btn{margin-top:12px}
.grade2{display:grid;gap:16px}
.grade2>*,.card{min-width:0}
@media (min-width:1000px){.grade2{grid-template-columns:1.15fr 1fr;align-items:start}}
.secao{margin-top:22px}
.secao>h2{margin-bottom:10px}
.muted{color:var(--muted)}
.pos{color:var(--teal-ink)}
.neg{color:var(--danger)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:20px;background:var(--surface-3);color:var(--ink-2);font-size:12px;font-weight:500;white-space:nowrap}
.chip.ouro{background:var(--gold-tint);color:var(--gold-ink)}
.chip.perigo{background:var(--danger-tint);color:var(--danger)}
.chip.ok{background:var(--ok-tint);color:var(--ok)}
.chip svg.i{width:13px;height:13px}

/* filtros */
.filtros{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.seg{display:inline-flex;background:var(--surface-3);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;font-size:14px;font-weight:500;color:var(--ink-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(15,42,67,.12)}
.filtros select,.filtros input{min-height:38px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:6px 10px;font-size:14px;max-width:100%}
.filtros input[type=search]{flex:1;min-width:160px}

/* faixa de vencimentos (painel) */
.agenda{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px 14px}
.agenda-cab{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:2px 12px;margin-bottom:12px}
.agenda-cab p{margin:0;color:var(--muted);font-size:14px}
.faixa{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(62px,1fr);gap:6px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px;scrollbar-width:thin}
.dia{scroll-snap-align:start;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-height:140px;padding:8px 4px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink-2);cursor:default;text-align:center}
.dia .barra{position:absolute;left:12px;right:12px;bottom:68px;border-radius:4px 4px 0 0;background:var(--gold)}
.dia .sem{font-size:12px;color:var(--muted);text-transform:lowercase}
.dia .n{font-size:18px;font-weight:600;color:var(--ink);line-height:1.2}
.dia .v{font-size:11.5px;font-weight:600;min-height:17px;color:var(--gold-ink)}
.dia.tem{cursor:pointer;background:var(--gold-tint);border-color:transparent}
.dia.tem:hover{outline:2px solid var(--gold)}
.dia.hoje{border-color:var(--teal);border-width:2px}
.dia.hoje .sem{color:var(--teal-ink);font-weight:600}
.dia.venc{background:var(--danger-tint);border-color:transparent;cursor:pointer;justify-content:center;gap:4px}
.dia.venc .n,.dia.venc .v,.dia.venc .sem{color:var(--danger)}
.dia.venc svg.i{color:var(--danger)}

/* números-chave */
.chaves{display:grid;grid-template-columns:repeat(2,1fr);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);margin-top:16px;overflow:hidden}
.chave{padding:14px 16px;border-top:1px solid var(--line-2);border-left:1px solid var(--line-2)}
.chave:nth-child(-n+2){border-top:0}
.chave:nth-child(2n+1){border-left:0}
.chave .r{font-size:13px;color:var(--muted)}
.chave .val{font-size:20px;font-weight:600;margin-top:2px;letter-spacing:-.01em}
.chave .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.chave.destaque{background:var(--navy);color:var(--on-navy)}
.chave.destaque .r,.chave.destaque .sub{color:var(--on-navy-2)}
.chaves.cinco .chave:last-child,.chaves.tres .chave:last-child{grid-column:1/-1}
@media (min-width:760px){
  .chaves.tres .chave:last-child{grid-column:auto}
  .chaves{grid-template-columns:repeat(var(--cols,4),1fr)}
  .chaves.cinco{--cols:5}
  .chaves.tres{--cols:3}
  .chaves.cinco .chave:last-child{grid-column:auto}
  .chave{border-top:0 !important;border-left:1px solid var(--line-2) !important}
  .chave:first-child{border-left:0 !important}
}

/* linhas de contas a pagar / lançamentos */
.lista{list-style:none;margin:0;padding:0}
.grupo-cab{display:flex;justify-content:space-between;gap:12px;padding:14px 18px 6px;font-size:13px;font-weight:600;color:var(--muted)}
.grupo-cab.perigo{color:var(--danger)}
.linha{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:11px 18px;border-top:1px solid var(--line-2)}
.grupo-cab+.lista .linha:first-child{border-top:0}
.linha.clicavel{cursor:pointer}
.linha.clicavel:hover{background:var(--surface-2)}
.linha .t{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.linha .s{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.linha .info{min-width:0}
.linha .dir{text-align:right;display:flex;align-items:center;gap:10px}
.linha .valor{font-weight:600;white-space:nowrap}
.linha .valor small{display:block;font-size:12px;font-weight:400;color:var(--muted)}
.data-bloco{width:46px;text-align:center;border-radius:10px;background:var(--surface-3);padding:5px 0;line-height:1.1}
.data-bloco b{display:block;font-size:17px}
.data-bloco span{font-size:11.5px;color:var(--muted)}
.data-bloco.perigo{background:var(--danger-tint);color:var(--danger)}
.data-bloco.perigo span{color:var(--danger)}
.data-bloco.hoje{background:var(--gold-tint);color:var(--gold-ink)}
.data-bloco.pago{background:var(--ok-tint);color:var(--ok)}
.data-bloco.pago span{color:var(--ok)}
.tipo-ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--surface-3);color:var(--ink-2)}
.tipo-ic.receita{background:var(--teal-tint);color:var(--teal-ink)}
.tipo-ic.despesa{background:var(--gold-tint);color:var(--gold-ink)}
.tipo-ic svg.i{width:18px;height:18px}
.linha .valor.receita{color:var(--teal-ink)}
.linha .valor.transferencia{color:var(--muted);font-weight:500}
.dia-cab{display:flex;justify-content:space-between;padding:12px 18px 4px;font-size:13px;color:var(--muted);font-weight:500;border-top:1px solid var(--line-2)}
.dia-cab:first-child{border-top:0}
.so-celular{display:none}
@media (max-width:560px){
  .so-celular{display:inline}
  .so-grande{display:none !important}
  .chip .chip-txt{display:none}
  .btn-pagar span{display:none}
  .linha .dir .btn-pagar{padding:5px 9px}
  .linha{gap:10px;padding:11px 14px}
  .linha .dir .btn{padding:5px 10px}
  .grupo-cab,.dia-cab{padding-left:14px;padding-right:14px}
}

/* resumo em três */
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);margin-bottom:14px;overflow:hidden}
.trio>div{padding:12px 14px;border-left:1px solid var(--line-2)}
.trio>div:first-child{border-left:0}
.trio .r{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:5px}
.trio .v{font-weight:600;white-space:nowrap}
.trio .r svg.i{width:15px;height:15px}
.trio .perigo .r,.trio .perigo .v{color:var(--danger)}
.trio .v{font-size:17px}
@media (max-width:520px){
  .trio{grid-template-columns:1fr}
  .trio>div{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:0 10px;padding:9px 14px;border-left:0;border-top:1px solid var(--line-2)}
  .trio>div:first-child{border-top:0}
  .trio>div>.muted{flex-basis:100%;text-align:right;margin-top:-2px}
  .trio .v{font-size:16px}
}

/* mês */
.mesnav{display:flex;align-items:center;gap:4px;margin-bottom:12px}
.mesnav h2{min-width:170px;text-align:center;font-size:17px}

/* contas e bancos */
.contas-grade{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.conta-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;display:flex;flex-direction:column;gap:10px}
.conta-topo{display:flex;align-items:center;gap:10px}
.avatar{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-weight:700;font-size:14px;background:var(--navy);color:var(--on-navy);flex:none}
.conta-card .saldo{font-size:22px;font-weight:600;letter-spacing:-.01em}
.conta-card .det{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:13px}
.conta-card .det>div>span{color:var(--muted);display:block}
.conta-card .acoes{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.medidor{height:8px;border-radius:4px;background:var(--surface-3);overflow:hidden}
.medidor i{display:block;height:100%;border-radius:4px;background:var(--teal)}
.medidor.ouro i{background:var(--gold)}
.medidor.perigo i{background:var(--danger)}

/* dívidas */
.divida-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px;display:grid;gap:12px}
.divida-card .linha1{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.divida-card .saldo{font-size:22px;font-weight:600;text-align:right}
.divida-card .saldo small{display:block;font-size:12px;color:var(--muted);font-weight:400}
.divida-card .det{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px 16px;font-size:14px}
.divida-card .det>div>span{display:block;font-size:12.5px;color:var(--muted)}
.divida-card .det b{font-weight:600}
.aviso{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--r);background:var(--gold-tint);color:var(--gold-ink);font-size:14px}
.aviso.perigo{background:var(--danger-tint);color:var(--danger)}
.aviso.info{background:var(--teal-tint);color:var(--teal-ink)}
.aviso svg.i{margin-top:1px}

/* análise */
.grafico{position:relative}
.grafico svg{display:block;width:100%;overflow:visible}
.grafico .eixo{font-size:11px;fill:var(--muted)}
.grafico .grade{stroke:var(--line-2);stroke-width:1}
.grafico .base{stroke:var(--line);stroke-width:1}
.legenda{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);margin-bottom:8px}
.legenda span{display:inline-flex;align-items:center;gap:6px}
.legenda i{width:12px;height:12px;border-radius:3px;display:inline-block}
.dica{position:absolute;pointer-events:none;z-index:5;background:var(--navy);color:var(--on-navy);border-radius:10px;padding:8px 11px;font-size:13px;min-width:170px;box-shadow:0 6px 20px rgba(0,0,0,.2);opacity:0;transition:opacity .12s}
.dica.vis{opacity:1}
.dica b{display:block;margin-bottom:4px}
.dica div{display:flex;justify-content:space-between;gap:14px}
.dica i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:6px}
.cats{display:grid;gap:9px}
.cat{display:grid;grid-template-columns:minmax(90px,150px) 1fr auto;gap:10px;align-items:center;font-size:14px}
.cat .nome{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat .trilho{height:14px;border-radius:0 4px 4px 0;background:transparent;position:relative}
.cat .trilho i{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0;background:var(--desp)}
.cat .v{text-align:right;white-space:nowrap;font-weight:500}
.cat .v small{color:var(--muted);font-weight:400;margin-left:6px}
@media (max-width:560px){
  .cat{grid-template-columns:1fr auto;gap:3px 10px}
  .cat .trilho{grid-column:1/-1;order:3;height:10px}
}
table.tab{width:100%;border-collapse:collapse;font-size:14px}
table.tab th{text-align:left;font-weight:500;color:var(--muted);font-size:12.5px;padding:8px 10px;border-bottom:1px solid var(--line)}
table.tab td{padding:9px 10px;border-bottom:1px solid var(--line-2)}
table.tab td.n,table.tab th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.tab tr.total td{font-weight:600;border-bottom:0}
.rolavel{overflow-x:auto}
details.tabela summary{cursor:pointer;color:var(--teal-ink);font-weight:500;font-size:14px;margin-top:10px}

/* modal */
dialog{border:0;padding:0;border-radius:var(--r-lg);background:var(--surface);color:var(--ink);width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 32px);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog.largo{width:min(920px,calc(100vw - 24px))}
dialog::backdrop{background:rgba(8,20,32,.55)}
.modal{display:flex;flex-direction:column;max-height:calc(100vh - 32px)}
.modal>header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px 8px}
.modal>header h2{font-size:18px}
.modal .corpo{padding:6px 18px 12px;overflow-y:auto}
.modal>footer{display:flex;gap:8px;justify-content:flex-end;align-items:center;padding:12px 18px 16px;border-top:1px solid var(--line-2);flex-wrap:wrap}
.modal>footer .esq{margin-right:auto;display:flex;gap:6px;flex-wrap:wrap}
@media (max-width:560px){
  dialog{width:100vw;max-width:100vw;max-height:94vh;margin:auto 0 0;border-radius:18px 18px 0 0}
  .modal{max-height:94vh}
  .modal>footer{padding-bottom:max(16px, env(safe-area-inset-bottom))}
}

.campo{display:flex;flex-direction:column;gap:5px;font-size:14px;min-width:0}
.campo.cheio{grid-column:1/-1}
.campo>span{font-weight:500;color:var(--ink-2)}
.campo>small{color:var(--muted);font-size:12.5px}
.campo input,.campo select,.campo textarea{min-height:42px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:8px 11px;width:100%}
.campo textarea{min-height:70px;resize:vertical}
.campo input:focus,.campo select:focus,.campo textarea:focus{outline:2px solid var(--focus);outline-offset:0;border-color:transparent}
.campo.valor input{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}

.seg.cheio{display:flex;width:100%}
.seg.cheio button{flex:1}
.erro{color:var(--danger);font-size:14px;min-height:20px;margin:6px 0 0}
.lista-mini{list-style:none;margin:0;padding:0}
.lista-mini li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line-2)}
.lista-mini li:first-child{border-top:0}
.prev{max-height:52vh;overflow:auto;border:1px solid var(--line);border-radius:var(--r)}
.prev table td{padding:6px 8px}
.prev table th{position:sticky;top:0;background:var(--surface);z-index:1}
.prev input[type=text]{width:100%;min-width:120px;border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:var(--surface)}
.prev tr.dup td{color:var(--muted)}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--navy)}
.login-card{width:min(400px,100%);background:var(--surface);border-radius:20px;padding:28px 26px}
.login-card .marca{margin-bottom:22px}
.login-card .marca b{color:var(--ink)}
.login-card .marca span{color:var(--muted)}
.login-card h1{font-size:21px;margin-bottom:16px}
.login-card .campo{margin-bottom:12px}
.login-card .nota{font-size:13px;color:var(--muted);margin:14px 0 0}
.carregando{min-height:60vh;display:grid;place-items:center;color:var(--muted)}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);z-index:100;background:var(--navy);color:var(--on-navy);padding:11px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:all .18s;max-width:calc(100vw - 32px);box-shadow:0 8px 24px rgba(0,0,0,.25)}
#toast.vis{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.erro{background:var(--danger);color:#fff}
@media (min-width:900px){#toast{bottom:28px}}

/* boas-vindas */
.passos{list-style:none;counter-reset:p;margin:0;padding:0;display:grid;gap:10px}
.passos li{counter-increment:p;display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.passos li::before{content:counter(p);width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--teal-tint);color:var(--teal-ink);font-weight:700}
.passos li.feito::before{content:"✓";background:var(--ok-tint);color:var(--ok)}
.passos b{display:block}
.passos span{font-size:13.5px;color:var(--muted)}
@media (max-width:560px){.passos li{grid-template-columns:34px 1fr}.passos li .btn{grid-column:2;justify-self:start}}
.menu-lista a,.menu-lista button{display:flex;align-items:center;gap:12px;width:100%;padding:14px 18px;border:0;border-top:1px solid var(--line-2);background:transparent;color:var(--ink);text-decoration:none;font-weight:500;cursor:pointer;text-align:left}
.menu-lista>:first-child{border-top:0}
.menu-lista a:hover,.menu-lista button:hover{background:var(--surface-2)}
.menu-lista small{display:block;color:var(--muted);font-weight:400;font-size:13px}
@media (prefers-reduced-motion: reduce){*{transition:none !important;scroll-behavior:auto !important}}

async function q(p){ const { data, error } = await p; if (error) throw error; return data; }
async function buscarTudo(fabrica){
  const tam = 1000; let de = 0, out = [];
  for (;;) {
    const lote = await q(fabrica().range(de, de + tam - 1));
    out = out.concat(lote);
    if (lote.length < tam) break;
    de += tam;
  }
  return out;
}
async function carregar(){
  const desde = mesAdd(mesDe(hoje()), -13) + '-01';
  const [contas, saldos, cps, crs, dividas, lancs, lego] = await Promise.all([
    q(sb.from('fin_contas').select('*').order('nome')),
    q(sb.from('fin_saldos').select('conta_id,saldo')),
    buscarTudo(() => sb.from('fin_contas_pagar').select('*').or(`status.eq.pendente,vencimento.gte.${desde}`).order('vencimento').order('id')),
    buscarTudo(() => sb.from('fin_contas_receber').select('*').or(`status.eq.pendente,recebido_em.gte.${desde}`).order('id')),
    q(sb.from('fin_dividas').select('*').order('credor')),
    buscarTudo(() => sb.from('fin_lancamentos').select('*').gte('data', desde).order('data', { ascending:false }).order('criado_em', { ascending:false }).order('id')),
    buscarTudo(() => sb.from('fin_lego').select('*').order('data', { ascending:false }).order('id')).catch(() => null)
  ]);
  S.legoErro = lego === null;
  S.raw = { contas, cps, dividas, lancs, lego: lego || [],
    crs: crs.sort((a, b) => (a.previsao || '9999').localeCompare(b.previsao || '9999') || String(a.descricao).localeCompare(String(b.descricao), 'pt-BR')) };
  S.desde = desde; S.extra = {};
  aplicarModo();
  S.saldos = Object.fromEntries(saldos.map(s => [s.conta_id, Number(s.saldo)]));
  S.pronto = true;
}

  if (!m) { S.contas = R.contas; S.cps = R.cps; S.crs = R.crs; S.dividas = R.dividas; S.lancs = R.lancs; S.lego = R.lego; return; }
  S.contas = R.contas.filter(c => (c.esfera || 'pessoal') === m);
  const ids = new Set(S.contas.map(c => c.id));
  const doModo = x => (x.esfera || 'pessoal') === m;

function patrimonio(){
  let disp = 0, inv = 0, fat = 0, nDisp = 0;
  for (const c of S.contas) {
    if (!c.ativa) continue;
    const s = saldo(c.id);
    if (c.tipo === 'cartao') fat += Math.max(0, -s);
    else if (c.tipo === 'investimento') inv += s;
    else { disp += s; nDisp++; }
  }
  const ativas = S.dividas.filter(d => d.ativa);
  const div = ativas.reduce((a, d) => a + Number(d.saldo_devedor || 0), 0);
  const parcelas = ativas.reduce((a, d) => a + Number(d.valor_parcela || 0), 0);
  return { disp, inv, fat, div, parcelas, nDisp, pl: disp + inv - fat - div };
}
function categorias(tipo){
  const base = tipo === 'receita' ? CAT_REC : tipo === 'transferencia' ? ['Pagamento de fatura','Aplicação','Resgate','Transferência','Retirada da clínica','Aporte na clínica'] : CAT_DESP;
  const usadas = new Set(base);
  for (const l of S.lancs) if (l.categoria && l.tipo === tipo) usadas.add(l.categoria);
  if (tipo === 'despesa') for (const c of S.cps) if (c.categoria) usadas.add(c.categoria);
  return [...usadas];
}

/* dívidas */
function diaNoMes(m, dia){ const d = pISO(m + '-01'); const ult = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); return m + '-' + String(Math.min(dia, ult)).padStart(2, '0'); }
function proxVencDivida(d){
  const h = hoje(), m = mesDe(h);
  const dia = Number(d.dia_vencimento) || pISO(h).getDate();
  const pagouEsteMes = S.lancs.some(l => l.divida_id === d.id && mesDe(l.data) === m);
  let s = diaNoMes(m, dia);
  if (pagouEsteMes || s < h) s = diaNoMes(mesAdd(m, 1), dia);
  return s;
}
function calcDivida(d){
  const pv = Number(d.saldo_devedor) || 0, r = (Number(d.taxa_juros_mensal) || 0) / 100, pmt = Number(d.valor_parcela) || 0;
  const res = { n:null, juros:null, quitacao:null, aviso:'', taxaAno: (Math.pow(1 + r, 12) - 1) * 100,
    restContrato: d.parcelas_total ? Math.max(0, d.parcelas_total - (d.parcelas_pagas || 0)) : null };
  if (pv <= 0) { res.n = 0; res.juros = 0; return res; }
  if (pmt > 0) {
    if (r > 0 && pmt <= pv * r) res.aviso = 'A parcela não cobre os juros do mês: a dívida cresce.';
    else {
      let s = pv, j = 0, n = 0;
      while (s > 0.005 && n < 1200) { const ji = s * r; j += ji; s = s + ji - pmt; n++; }
      res.n = n; res.juros = j;
    }
  }
  const n = res.restContrato ?? res.n;
  if (n) res.quitacao = addMeses(proxVencDivida(d), n - 1);
  return res;
}
const parcelasRestantes = d => { const c = calcDivida(d); return c.restContrato ?? c.n ?? 0; };

}
function barrasCats(cats, max, total, meses){
  let itens = cats.slice(0, max);
  if (cats.length > max) itens.push({ nome: 'Outras (' + (cats.length - max) + ')', v: cats.slice(max).reduce((a, c) => a + c.v, 0) });
  const topo = Math.max(...itens.map(c => c.v), 1);
  return `<div class="cats">${itens.map(c => `<div class="cat" title="${esc(c.nome)}: ${brl(c.v)} (${pct(c.v / total)})${meses ? ', média ' + brl(c.v / meses) + '/mês' : ''}">

    <span class="v">${money(c.v)}<small>${pct(c.v / total)}</small></span></div>`).join('')}</div>`;
}

  if (fd.cartao_id && fd.conta_id === fd.cartao_id) return 'A conta usada para pagar não pode ser o próprio cartão.';

  };

  if (id) {
    await q(sb.from('fin_contas_pagar').update(reg).eq('id', id));
    toast('Alterações salvas');
  } else {
    const n = Math.max(1, Math.min(120, parseInt(fd.parcelas, 10) || 1));
    const regs = n === 1 ? [reg] : Array.from({ length: n }, (_, i) => ({ ...reg, recorrencia: 'nenhuma', descricao: `${reg.descricao} (${i + 1}/${n})`, vencimento: addMeses(reg.vencimento, i) }));
    await q(sb.from('fin_contas_pagar').insert(regs));

VIEWS.receber = () => {
  const f = S.f, h = hoje();
  const busca = norm(f.crBusca.trim());
  const filtrar = arr => busca ? arr.filter(c => norm([c.descricao, c.pagador, c.categoria].join(' ')).includes(busca)) : arr;
  const pend = filtrar(aReceber());
  const soma = a => a.reduce((s, c) => s + Number(c.valor), 0);
  const fimMes = mesAdd(mesDe(h), 1) + '-01';
  const atrasados = pend.filter(c => c.previsao && c.previsao < h);
  const esteMes = pend.filter(c => c.previsao && c.previsao >= h && c.previsao < fimMes);
  const adiante = pend.filter(c => c.previsao && c.previsao >= fimMes);
  const semData = pend.filter(c => !c.previsao);
  let corpo = '';
  if (f.crStatus !== 'recebido') {
    const grupos = [['Atrasados', atrasados, 'perigo'], ['Ainda este mês', esteMes], ['Próximos meses', adiante], ['Sem data prevista', semData]];
    corpo += grupos.filter(g => g[1].length).map(([t, arr, cls]) => `<div class="grupo-cab ${cls || ''}"><span>${cls ? ic('alerta', 'style="width:15px;height:15px;vertical-align:-3px"') + ' ' : ''}${t}</span><span>${money(soma(arr))}</span></div><ul class="lista">${arr.map(linhaCR).join('')}</ul>`).join('');
  }
  if (f.crStatus !== 'pendente') {
    const recs = filtrar(S.crs.filter(c => c.status === 'recebido')).sort((a, b) => (b.recebido_em || '').localeCompare(a.recebido_em || ''));
    const porMes = new Map();
    for (const c of recs) { const k = mesDe(c.recebido_em || c.previsao || h); if (!porMes.has(k)) porMes.set(k, []); porMes.get(k).push(c); }
    corpo += [...porMes.entries()].map(([m, arr]) => `<div class="grupo-cab"><span>Recebidos em ${nomeMes(m)}</span><span>${money(arr.reduce((s, c) => s + Number(c.valor_recebido ?? c.valor), 0))}</span></div><ul class="lista">${arr.map(linhaCR).join('')}</ul>`).join('');
  }
  if (!corpo) corpo = `<div class="vazio">${busca ? 'Nada encontrado para essa busca.' : f.crStatus === 'recebido' ? 'Nenhum valor recebido nos últimos 12 meses.' : 'Nada a receber cadastrado.'}<br>${busca ? '' : `<button class="btn" data-act="novaCR">${ic('plus')}Cadastrar valor a receber</button>`}</div>`;
  const ate = atrasados.concat(esteMes);
  return `
  <div class="cab"><div><h1>A receber</h1><p>Pagamentos, repasses e reembolsos que ainda vão entrar</p></div>
    <div class="acoes"><button class="btn primario" data-act="novaCR">${ic('plus')}Nova conta a receber</button></div></div>
  <div class="trio">
    <div><div class="r">Total a receber</div><div class="v pos">${money(soma(pend))}</div><div class="muted" style="font-size:12.5px">${pend.length} valor${pend.length === 1 ? '' : 'es'}</div></div>
    <div class="${atrasados.length ? 'perigo' : ''}"><div class="r">${atrasados.length ? ic('alerta') : ''}Previsto até o fim do mês</div><div class="v">${money(soma(ate))}</div><div class="muted" style="font-size:12.5px">${atrasados.length ? `${atrasados.length} atrasado${atrasados.length === 1 ? '' : 's'}` : `${ate.length} valor${ate.length === 1 ? '' : 'es'}`}</div></div>
    <div><div class="r">Sem data prevista</div><div class="v">${money(soma(semData))}</div><div class="muted" style="font-size:12.5px">${semData.length} valor${semData.length === 1 ? '' : 'es'}</div></div>
  </div>
  <div class="filtros">
    <div class="seg" role="group" aria-label="Situação">${[['pendente','A receber'],['recebido','Recebidos'],['todas','Todos']].map(([v,t]) => `<button type="button" data-act="filtro" data-k="crStatus" data-v="${v}" aria-pressed="${f.crStatus === v}">${t}</button>`).join('')}</div>
    <input type="search" id="crBusca" data-f="crBusca" value="${esc(f.crBusca)}" placeholder="Buscar descrição, pagador ou categoria" aria-label="Buscar">
  </div>
  <section class="card" style="padding-bottom:6px">${corpo}</section>`;
};
function formCR(c){
  const novo = !c; c = c || { esfera: esfPadrao() };
  const rec = c.status === 'recebido';
  abrir(`<form class="modal" data-form="cr" data-id="${c.id || ''}" novalidate>
    <header><h2>${novo ? 'Nova conta a receber' : rec ? 'Valor recebido' : 'Conta a receber'}</h2><button type="button" class="ic" data-act="fechar" aria-label="Fechar">${ic('fechar')}</button></header>

      <div class="campos">

        <label class="campo"><span>Quem paga</span><input name="pagador" maxlength="120" value="${esc(c.pagador)}" placeholder="Ex.: Sanofi, hospital, plano"></label>

    <footer>
      ${novo ? '' : `<div class="esq"><button type="button" class="btn perigo peq" data-act="excluirCR" data-id="${c.id}">${ic('lixo')}Excluir</button></div>`}
      ${!novo && !rec ? `<button type="button" class="btn" data-act="receberCR" data-id="${c.id}">Marcar como recebido</button>` : ''}
      <button class="btn primario" type="submit">${novo ? 'Salvar' : 'Salvar alterações'}</button>
    </footer></form>`);
}
ACTS.novaCR = () => formCR(null);
ACTS.editarCR = ({ id }) => formCR(S.crs.find(c => c.id === id));
FORMS.cr = async (fd, form) => {

  if (!(valor > 0)) return 'Informe um valor maior que zero.';
  const reg = {
    descricao: fd.descricao.trim(), valor: r2(valor), previsao: fd.previsao || null,

    conta_id: fd.conta_id || null, esfera: fd.esfera, observacao: (fd.observacao || '').trim() || null
  };

  const f = S.f, m = f.lMes;

  const busca = norm(f.lBusca.trim());

    <select data-f="lTipo" aria-label="Tipo"><option value="">Todos os tipos</option>${[['receita','Receitas'],['despesa','Despesas'],['transferencia','Transferências']].map(([v,t]) => `<option value="${v}" ${f.lTipo === v ? 'selected' : ''}>${t}</option>`).join('')}</select>
    <select data-f="lConta" aria-label="Conta"><option value="">Todas as contas</option>${S.contas.map(c => `<option value="${c.id}" ${f.lConta === c.id ? 'selected' : ''}>${esc(c.nome)}</option>`).join('')}</select>

FORMS.lanc = async (fd, form) => {
  const id = form.dataset.id, valor = parseValor(fd.valor);
  if (!(valor > 0)) return 'Informe um valor maior que zero.';
  if (!fd.data) return 'Informe a data.';
  if (!fd.descricao.trim()) return 'Informe a descrição.';
  if (fd.tipo === 'transferencia') {
    if (!fd.conta_id || !fd.conta_destino_id) return 'Escolha as duas contas da transferência (ou “Conta fora da central”).';
    if (fd.conta_id === 'fora' && fd.conta_destino_id === 'fora') return 'Pelo menos uma das contas precisa estar cadastrada aqui.';
    if (fd.conta_id === fd.conta_destino_id) return 'As contas de origem e destino precisam ser diferentes.';
  }
  const fora = v => v === 'fora' ? null : (v || null);
  const reg = { tipo: fd.tipo, valor: r2(valor), data: fd.data, descricao: fd.descricao.trim(), categoria: (fd.categoria || '').trim() || null,
    esfera: fd.esfera, conta_id: fora(fd.conta_id), conta_destino_id: fd.tipo === 'transferencia' ? fora(fd.conta_destino_id) : null, observacao: (fd.observacao || '').trim() || null };
  if (id) await q(sb.from('fin_lancamentos').update(reg).eq('id', id));
  else await q(sb.from('fin_lancamentos').insert(reg));
  fechar(); toast(id ? 'Alterações salvas' : 'Lançamento salvo');

async function lerTexto(file){
  const buf = await file.arrayBuffer();
  try { return new TextDecoder('utf-8', { fatal: true }).decode(buf); }
  catch { return new TextDecoder('windows-1252').decode(buf); }

function parseData(s){
  s = String(s || '').trim();
  let m = s.match(/^(\d{4})(\d{2})(\d{2})/); if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  m = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/);
  if (m) { const y = m[3].length === 2 ? '20' + m[3] : m[3]; return `${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`; }

}
function parseOFX(txt){
  const tag = (b, t) => { const m = b.match(new RegExp('<' + t + '>([^<\\r\\n]*)', 'i')); return m ? m[1].trim() : ''; };

}

    else if (ch === sep && !aspas) { out.push(cur); cur = ''; }
    else cur += ch;
  }
  out.push(cur); return out.map(s => s.trim());
}
function parseCSV(txt){

  let iCab = linhas.findIndex(l => /data|date/i.test(l) && /valor|amount|value/i.test(l));
  if (iCab < 0) throw new Error('Não encontrei as colunas de data e valor no CSV. A primeira linha precisa ter os nomes das colunas.');
  const cab = splitCSV(linhas[iCab], sep).map(norm);
  const achar = (re, ...fora) => cab.findIndex((c, i) => !fora.includes(i) && re.test(c));
  const cD = achar(/^data|date|^dt/);
  const cV = achar(/^valor|amount|value|^vlr|^quantia/, cD);
  const cCred = cV < 0 ? achar(/credito|entrada/, cD) : -1, cDeb = cV < 0 ? achar(/debito|saida/, cD) : -1;
  if (cV < 0 && cCred < 0 && cDeb < 0) throw new Error('Não encontrei a coluna de valor no CSV.');
  const cI = achar(/identificador|^id$|fitid|documento/, cD, cV);
  const cHs = cab.map((c, i) => i).filter(i => ![cD, cV, cCred, cDeb, cI].includes(i) && /descri|historico|title|titulo|memo|estabelecimento|detalhe|lancamento|favorecido/.test(cab[i]) && !/saldo|categoria/.test(cab[i]));
  const cont = {};
  const regs = [];
  for (const l of linhas.slice(iCab + 1)) {
    const c = splitCSV(l, sep);
    const data = parseData(c[cD]);
    const valor = cV > -1 ? parseValor(c[cV]) : (cCred > -1 ? (parseValor(c[cCred]) || 0) : 0) - (cDeb > -1 ? Math.abs(parseValor(c[cDeb]) || 0) : 0);
    if (!data || !isFinite(valor) || valor === 0) continue;
    const descricao = [...new Set(cHs.map(i => (c[i] || '').replace(/\s+/g, ' ').trim()).filter(Boolean))].join(' – ') || 'Sem descrição';
    let fitid = cI > -1 && c[cI] ? c[cI] : null;
    if (!fitid) { const k = `${data}|${chaveDesc(descricao)}|${valor.toFixed(2)}`; cont[k] = (cont[k] || 0) + 1; fitid = 'csv:' + hash(k + '#' + cont[k]); }

}
function hash(s){ let h1 = 0xdeadbeef, h2 = 0x41c6ce57; for (let i = 0; i < s.length; i++) { const c = s.charCodeAt(i); h1 = Math.imul(h1 ^ c, 2654435761); h2 = Math.imul(h2 ^ c, 1597334677); }

function sugerirCategoria(desc, tipo, historico){
  const k = chaveDesc(desc);

  const n = ' ' + norm(desc) + ' ';

}

}

async function pluggy(acao, extra = {}){

    s.onload = ok; s.onerror = () => { pluggyJs = null; falha(new Error('Não consegui abrir o Pluggy. Verifique a internet.')); };

}

ACTS.ofSync = async ({ acc }, el) => {
  const conta = S.contas.find(c => c.pluggy_account_id === acc); if (!conta) return;

  catch (e) { if (el) { el.disabled = false; el.textContent = 'Buscar lançamentos'; } throw e; }
  if (!r.transacoes.length) { fechar(); return toast('Nenhum lançamento novo nesse período.'); }
  const existentes = new Set(await buscarTudo(() => sb.from('fin_lancamentos').select('fitid').eq('conta_id', conta.id).like('fitid', 'pluggy:%').order('id')).then(x => x.map(y => y.fitid)));

  for (const l of [...S.lancs].reverse()) if (l.categoria) historico.set(l.tipo + '|' + chaveDesc(l.descricao), l.categoria);

  const conta2 = new Map(); for (const l of antigos) { const tp = l.tipo !== 'transferencia' ? l.tipo : l.conta_destino_id === conta.id ? 'receita' : 'despesa'; const k = l.data + '|' + tp + '|' + Number(l.valor).toFixed(2); conta2.set(k, (conta2.get(k) || 0) + 1); }

  S.imp = { conta, formato: 'Open Finance', inverter: false, historico, regs: r.transacoes.sort((a, b) => b.data.localeCompare(a.data)).map(t => ({ ...t, dup: jaTem(t) })) };
  aplicarSinais();
  renderImport();
};

VIEWS.contas = () => {
  const lista = S.contas.filter(c => c.ativa || S.f.contasInativas);
  const inativas = S.contas.filter(c => !c.ativa).length;
  const grupos = [
    ['Contas e dinheiro', lista.filter(c => ['corrente','poupanca','carteira','outro'].includes(c.tipo))],
    ['Cartões de crédito', lista.filter(c => c.tipo === 'cartao')],
    ['Investimentos', lista.filter(c => c.tipo === 'investimento')]
  ].filter(g => g[1].length);
  const P = patrimonio();
  return `
  <div class="cab"><div><h1>Contas e bancos</h1><p>Saldos calculados a partir dos lançamentos</p></div><div class="acoes"><button class="btn primario" data-act="novaConta">${ic('plus')}Nova conta</button></div></div>
  ${S.contas.length ? `<section class="chaves" style="margin:0 0 18px"><div class="chave"><div class="r">Disponível</div><div class="val">${money(P.disp)}</div></div><div class="chave"><div class="r">Investido</div><div class="val">${money(P.inv)}</div></div><div class="chave"><div class="r">Faturas em aberto</div><div class="val">${money(P.fat)}</div></div><div class="chave destaque"><div class="r">Patrimônio líquido</div><div class="val">${money(P.pl)}</div></div></section>` : ''}
  ${grupos.map(([t, arr]) => `<div class="secao"><h2>${t}</h2><div class="contas-grade">${arr.map(cardConta).join('')}</div></div>`).join('') || `<section class="card"><div class="vazio">Nenhuma conta cadastrada.<br><button class="btn primario" data-act="novaConta">${ic('plus')}Cadastrar primeira conta</button></div></section>`}
  ${inativas ? `<p style="margin-top:18px"><button class="link" data-act="filtro" data-k="contasInativas" data-v="${!S.f.contasInativas}">${S.f.contasInativas ? 'Esconder' : 'Mostrar'} ${inativas} conta${inativas > 1 ? 's' : ''} desativada${inativas > 1 ? 's' : ''}</button></p>` : ''}`;
};
function iniciais(c){ const b = (c.banco || c.nome || '?').replace(/[^\p{L}\p{N} ]/gu, '').trim().split(/\s+/); return ((b[0] || '?')[0] + (b[1] ? b[1][0] : (b[0] || '')[1] || '')).toUpperCase(); }
function cardConta(c){
  const s = saldo(c.id);
  let meio, det = '';
  if (c.tipo === 'cartao') {
    const fat = Math.max(0, -s), lim = Number(c.limite) || 0;
    meio = `<div><div class="muted" style="font-size:13px">Fatura em aberto</div><div class="saldo">${money(fat)}</div></div>
      ${lim ? `<div class="medidor ${fat / lim > .8 ? 'perigo' : 'ouro'}" title="${pct(fat / lim)} do limite"><i style="width:${Math.min(100, fat / lim * 100)}%"></i></div>` : ''}`;
    det = `<div class="det">${lim ? `<div><span>Limite disponível</span>${money(lim - fat)}</div>` : ''}${c.dia_fechamento ? `<div><span>Fecha</span>dia ${c.dia_fechamento}</div>` : ''}${c.dia_vencimento ? `<div><span>Vence</span>dia ${c.dia_vencimento}</div>` : ''}${s > 0 ? `<div><span>Crédito</span>${money(s)}</div>` : ''}</div>`;
  } else {
    meio = `<div><div class="muted" style="font-size:13px">${c.tipo === 'investimento' ? 'Valor aplicado' : 'Saldo'}</div><div class="saldo ${s < 0 ? 'neg' : ''}">${money(s)}</div></div>`;
  }
  return `<article class="conta-card">
    <div class="conta-topo"><div class="avatar" aria-hidden="true">${esc(iniciais(c))}</div><div style="min-width:0"><b style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(c.nome)}</b><span class="muted" style="font-size:13px">${esc([c.banco, TIPOS_CONTA[c.tipo], c.esfera === 'profissional' ? 'profissional' : ''].filter(Boolean).join(', '))}${c.ativa ? '' : ' <span class="chip">desativada</span>'}</span></div></div>
    ${meio}${det}
    <div class="acoes"><button class="btn peq" data-act="ajustarSaldo" data-id="${c.id}">${c.tipo === 'cartao' ? 'Informar fatura' : 'Informar saldo'}</button><button class="btn peq" data-act="verLancConta" data-id="${c.id}">Lançamentos</button><button class="btn peq" data-act="editarConta" data-id="${c.id}" aria-label="Editar ${esc(c.nome)}">${ic('editar')}</button></div>
  </article>`;
}
ACTS.verLancConta = ({ id }) => { S.f.lConta = id; S.f.lMes = mesDe(hoje()); irPara('lancamentos'); };
function formConta(c){
  const novo = !c; c = c || { tipo: 'corrente', esfera: esfPadrao(), ativa: true, saldo_inicial: 0 };
  abrir(`<form class="modal" data-form="conta" data-id="${c.id || ''}" novalidate>
    <header><h2>${novo ? 'Nova conta' : 'Editar conta'}</h2><button type="button" class="ic" data-act="fechar" aria-label="Fechar">${ic('fechar')}</button></header>
    <div class="corpo"><div class="campos">
      <label class="campo"><span>Nome</span><input name="nome" required maxlength="60" value="${esc(c.nome)}" placeholder="Ex.: Itaú PF, Nubank, XP" autofocus></label>
      <label class="campo"><span>Banco ou instituição</span><input name="banco" maxlength="60" value="${esc(c.banco)}" placeholder="Ex.: Itaú"></label>
      <label class="campo"><span>Tipo</span><select name="tipo" data-act-change="tipoConta">${Object.entries(TIPOS_CONTA).map(([v,t]) => `<option value="${v}" ${c.tipo === v ? 'selected' : ''}>${t}</option>`).join('')}</select></label>
      <label class="campo"><span>Pessoal ou profissional</span><select name="esfera">${optEsfera(c.esfera)}</select></label>
      ${novo ? `<label class="campo cheio valor" data-so="naoCartao" ${c.tipo === 'cartao' ? 'hidden' : ''}><span>Saldo hoje</span><input name="saldo" inputmode="decimal" value="" placeholder="0,00"><small>Use sinal de menos se estiver negativo.</small></label>
        <label class="campo cheio valor" data-so="cartao" ${c.tipo === 'cartao' ? '' : 'hidden'}><span>Fatura em aberto hoje</span><input name="fatura" inputmode="decimal" value="" placeholder="0,00"></label>` : ''}
      <label class="campo" data-so="cartao" ${c.tipo === 'cartao' ? '' : 'hidden'}><span>Limite</span><input name="limite" inputmode="decimal" value="${esc(valorInput(c.limite))}" placeholder="0,00"></label>
      <label class="campo" data-so="cartao" ${c.tipo === 'cartao' ? '' : 'hidden'}><span>Dia de fechamento</span><input name="dia_fechamento" type="number" min="1" max="31" value="${esc(c.dia_fechamento)}"></label>
      <label class="campo" data-so="cartao" ${c.tipo === 'cartao' ? '' : 'hidden'}><span>Dia de vencimento</span><input name="dia_vencimento" type="number" min="1" max="31" value="${esc(c.dia_vencimento)}"></label>
      <label class="campo cheio"><span>Observação</span><textarea name="observacao" maxlength="500">${esc(c.observacao)}</textarea></label>
      ${novo ? '' : `<label class="campo cheio" style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" name="ativa" ${c.ativa ? 'checked' : ''} style="width:auto;min-height:0"> Conta ativa (desmarque para esconder sem perder o histórico)</label>`}
    </div><p class="erro" role="alert"></p></div>
    <footer>${novo ? '' : `<div class="esq"><button type="button" class="btn perigo peq" data-act="excluirConta" data-id="${c.id}">${ic('lixo')}Excluir</button></div>`}
      <button type="button" class="btn" data-act="fechar">Cancelar</button><button class="btn primario" type="submit">${novo ? 'Salvar conta' : 'Salvar alterações'}</button></footer></form>`);
}
ACTS.novaConta = () => formConta(null);
ACTS.editarConta = ({ id }) => formConta(contaPor(id));
function aoMudarTipoConta(sel){
  const cartao = sel.value === 'cartao', f = sel.closest('form');
  f.querySelectorAll('[data-so=cartao]').forEach(e => e.hidden = !cartao);
  f.querySelectorAll('[data-so=naoCartao]').forEach(e => e.hidden = cartao);
}
FORMS.conta = async (fd, form) => {
  const id = form.dataset.id;
  if (!fd.nome.trim()) return 'Informe o nome da conta.';
  const cartao = fd.tipo === 'cartao';
  const dia = v => { const n = parseInt(v, 10); return n >= 1 && n <= 31 ? n : null; };
  const reg = { nome: fd.nome.trim(), banco: (fd.banco || '').trim() || null, tipo: fd.tipo, esfera: fd.esfera, observacao: (fd.observacao || '').trim() || null,
    limite: cartao && fd.limite ? r2(parseValor(fd.limite)) || null : null, dia_fechamento: cartao ? dia(fd.dia_fechamento) : null, dia_vencimento: cartao ? dia(fd.dia_vencimento) : null };
  if (id) {
    reg.ativa = !!form.querySelector('[name=ativa]').checked;
    await q(sb.from('fin_contas').update(reg).eq('id', id));
  } else {
    const v = cartao ? parseValor(fd.fatura || '0') : parseValor(fd.saldo || '0');
    if (!isFinite(v)) return cartao ? 'Valor da fatura inválido.' : 'Saldo inválido.';
    reg.saldo_inicial = r2(cartao ? -Math.abs(v) : v);
    await q(sb.from('fin_contas').insert(reg));
  }
  fechar(); toast(id ? 'Conta atualizada' : 'Conta cadastrada'); await recarregar();
};
ACTS.ajustarSaldo = ({ id }) => {
  const c = contaPor(id), s = saldo(id), cartao = c.tipo === 'cartao';
  abrir(`<form class="modal" data-form="ajuste" data-id="${id}" novalidate>
    <header><h2>${cartao ? 'Fatura de ' : 'Saldo de '}${esc(c.nome)}</h2><button type="button" class="ic" data-act="fechar" aria-label="Fechar">${ic('fechar')}</button></header>
    <div class="corpo"><p style="margin-top:0">Pelos lançamentos registrados, ${cartao ? 'a fatura em aberto é' : 'o saldo é'} <b>${money(cartao ? Math.max(0, -s) : s)}</b>. Informe o valor que aparece no ${cartao ? 'app do cartão' : 'banco'} agora e a diferença é corrigida, sem criar receita ou despesa.</p>
      <label class="campo valor"><span>${cartao ? 'Fatura em aberto hoje' : 'Saldo real hoje'}</span><input name="valor" inputmode="decimal" placeholder="0,00" autofocus></label>
      <p class="erro" role="alert"></p></div>
    <footer><button type="button" class="btn" data-act="fechar">Cancelar</button><button class="btn primario" type="submit">Corrigir</button></footer></form>`);
};
FORMS.ajuste = async (fd, form) => {
  const c = contaPor(form.dataset.id), v = parseValor(fd.valor);
  if (!isFinite(v)) return 'Informe o valor.';
  const real = c.tipo === 'cartao' ? -Math.abs(v) : v;
  const novo = r2(Number(c.saldo_inicial) + (real - saldo(c.id)));
  await q(sb.from('fin_contas').update({ saldo_inicial: novo }).eq('id', c.id));
  fechar(); toast('Saldo corrigido'); await recarregar();
};
ACTS.excluirConta = async ({ id }) => {
  const c = contaPor(id);
  const { count, error } = await sb.from('fin_lancamentos').select('id', { count: 'exact', head: true }).or(`conta_id.eq.${id},conta_destino_id.eq.${id}`);
  if (error) return erro(error);
  if (count) return confirmar('Esta conta tem lançamentos', `${esc(c.nome)} tem ${count} lançamento${count > 1 ? 's' : ''}. Para não bagunçar o histórico, desative a conta em vez de excluir.`, 'Desativar conta', async () => {
    await q(sb.from('fin_contas').update({ ativa: false }).eq('id', id)); toast('Conta desativada'); await recarregar(); });
  confirmar('Excluir conta?', `${esc(c.nome)} será excluída.`, 'Excluir', async () => { await q(sb.from('fin_contas').delete().eq('id', id)); toast('Conta excluída'); await recarregar(); }, true);
};

/* ---------------- dívidas ---------------- */
VIEWS.dividas = () => {
  const ativas = S.dividas.filter(d => d.ativa).sort((a, b) => (Number(b.taxa_juros_mensal) || 0) - (Number(a.taxa_juros_mensal) || 0));
  const quitadas = S.dividas.filter(d => !d.ativa);
  const total = ativas.reduce((a, d) => a + Number(d.saldo_devedor), 0);
  const parcelas = ativas.reduce((a, d) => a + Number(d.valor_parcela || 0), 0);
  const taxaMedia = total ? ativas.reduce((a, d) => a + Number(d.saldo_devedor) * (Number(d.taxa_juros_mensal) || 0), 0) / total : 0;
  const comTaxa = ativas.filter(d => Number(d.taxa_juros_mensal) > 0);
  const primeira = comTaxa.length > 1 ? comTaxa[0] : null;
  return `
  <div class="cab"><div><h1>Dívidas</h1><p>Financiamentos, empréstimos e parcelamentos</p></div><div class="acoes"><button class="btn primario" data-act="novaDivida">${ic('plus')}Nova dívida</button></div></div>
  ${ativas.length ? `<section class="chaves tres" style="margin:0 0 16px"><div class="chave"><div class="r">Saldo devedor total</div><div class="val">${money(total)}</div></div><div class="chave"><div class="r">Parcelas por mês</div><div class="val">${money(parcelas)}</div></div><div class="chave"><div class="r">Juros médios</div><div class="val num">${pctTaxa(taxaMedia)} <small style="font-size:13px;font-weight:400">ao mês</small></div><div class="sub">ponderado pelo saldo</div></div></section>` : ''}
  ${primeira ? `<div class="aviso info" style="margin-bottom:16px">${ic('info')}<div>Se sobrar dinheiro para amortizar, comece por <b>${esc(primeira.credor)}</b>: tem os juros mais altos (${pctTaxa(primeira.taxa_juros_mensal)} ao mês). A lista abaixo está nessa ordem.</div></div>` : ''}
  <div style="display:grid;gap:12px">${ativas.map(cardDivida).join('') || `<section class="card"><div class="vazio">Nenhuma dívida ativa.<br><button class="btn" data-act="novaDivida">${ic('plus')}Cadastrar dívida</button></div></section>`}</div>
  ${quitadas.length ? `<div class="secao"><h2>Quitadas</h2><section class="card"><ul class="lista">${quitadas.map(d => `<li class="linha clicavel" data-act="editarDivida" data-id="${d.id}"><div class="tipo-ic">${ic('check')}</div><div class="info"><div class="t">${esc(d.credor)}</div><div class="s">${esc(TIPOS_DIVIDA[d.tipo] || '')}</div></div><div class="dir"><span class="chip ok">quitada</span></div></li>`).join('')}</ul></section></div>` : ''}`;
};
function cardDivida(d){
  const c = calcDivida(d);
  const prog = d.parcelas_total ? (d.parcelas_pagas || 0) / d.parcelas_total : d.valor_original ? 1 - Number(d.saldo_devedor) / Number(d.valor_original) : null;
  return `<article class="divida-card">
    <div class="linha1"><div><b style="font-size:16px">${esc(d.credor)}</b><div class="muted" style="font-size:13px">${esc([TIPOS_DIVIDA[d.tipo], d.descricao, d.esfera === 'profissional' ? 'profissional' : ''].filter(Boolean).join(', '))}</div></div>
      <div class="saldo">${money(d.saldo_devedor)}<small>saldo devedor</small></div></div>
    ${prog !== null ? `<div><div class="medidor"><i style="width:${Math.max(0, Math.min(100, prog * 100))}%"></i></div><div class="muted" style="font-size:12.5px;margin-top:4px">${d.parcelas_total ? `${d.parcelas_pagas || 0} de ${d.parcelas_total} parcelas pagas` : pct(prog) + ' quitado'}</div></div>` : ''}
    <div class="det">
      <div><span>Parcela</span><b>${d.valor_parcela ? money(d.valor_parcela) : '—'}</b>${d.dia_vencimento ? `<span>todo dia ${d.dia_vencimento}</span>` : ''}</div>
      <div><span>Juros</span><b class="num">${pctTaxa(d.taxa_juros_mensal)} ao mês</b><span>${pctTaxa(c.taxaAno)} ao ano</span></div>
      <div><span>Faltam</span><b>${(c.restContrato ?? c.n) == null ? '—' : (c.restContrato ?? c.n) + ((c.restContrato ?? c.n) === 1 ? ' parcela' : ' parcelas')}</b>${c.restContrato != null && c.n != null && c.n !== c.restContrato ? `<span>pelo saldo: ${c.n}</span>` : ''}</div>
      <div><span>Quitação prevista</span><b>${c.quitacao ? nomeMes(mesDe(c.quitacao)).replace(' de ', '/') : '—'}</b></div>
      <div><span>Juros ainda a pagar</span><b>${c.juros != null ? money(c.juros) : '—'}</b><span>estimativa</span></div>
    </div>
    ${c.aviso ? `<div class="aviso perigo">${ic('alerta')}<div>${c.aviso}</div></div>` : ''}
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primario peq" data-act="pagarParcela" data-id="${d.id}">${ic('check')}Pagar parcela</button><button class="btn peq" data-act="editarDivida" data-id="${d.id}">${ic('editar')}Editar</button></div>
  </article>`;
}

    <div class="corpo"><div class="campos">
      <label class="campo"><span>Credor</span><input name="credor" required maxlength="80" value="${esc(d.credor)}" placeholder="Ex.: Caixa, Banco do Brasil" autofocus></label>
      <label class="campo"><span>Tipo</span><select name="tipo">${Object.entries(TIPOS_DIVIDA).map(([v,t]) => `<option value="${v}" ${d.tipo === v ? 'selected' : ''}>${t}</option>`).join('')}</select></label>
      <label class="campo cheio"><span>Descrição</span><input name="descricao" maxlength="120" value="${esc(d.descricao)}" placeholder="Ex.: Apartamento, Carro, Equipamento do consultório"></label>
      <label class="campo valor"><span>Saldo devedor hoje</span><input name="saldo_devedor" inputmode="decimal" required value="${esc(valorInput(d.saldo_devedor))}" placeholder="0,00"></label>
      ${num('valor_original', 'Valor original', valorInput(d.valor_original), 'placeholder="0,00"')}
      ${num('valor_parcela', 'Valor da parcela', valorInput(d.valor_parcela), 'placeholder="0,00"')}
      <label class="campo"><span>Juros ao mês (%)</span><input name="taxa_juros_mensal" inputmode="decimal" value="${d.taxa_juros_mensal != null ? esc(String(d.taxa_juros_mensal).replace('.', ',')) : ''}" placeholder="Ex.: 1,49"><small>Está no contrato como “taxa mensal” ou CET.</small></label>
      <label class="campo"><span>Total de parcelas</span><input name="parcelas_total" type="number" min="0" max="600" value="${esc(d.parcelas_total)}"></label>
      <label class="campo"><span>Parcelas já pagas</span><input name="parcelas_pagas" type="number" min="0" max="600" value="${esc(d.parcelas_pagas)}"></label>
      <label class="campo"><span>Dia de vencimento</span><input name="dia_vencimento" type="number" min="1" max="31" value="${esc(d.dia_vencimento)}"></label>
      <label class="campo"><span>Débito na conta</span><select name="conta_id">${opcoesContas(d.conta_id, { semCartao: true })}</select></label>
      <label class="campo"><span>Pessoal ou profissional</span><select name="esfera">${optEsfera(d.esfera)}</select></label>

      ${novo ? '' : `<label class="campo cheio" style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" name="ativa" ${d.ativa ? 'checked' : ''} style="width:auto;min-height:0"> Dívida ativa (desmarque quando quitar)</label>`}
    </div><p class="erro" role="alert"></p></div>
    <footer>${novo ? '' : `<div class="esq"><button type="button" class="btn perigo peq" data-act="excluirDivida" data-id="${d.id}">${ic('lixo')}Excluir</button></div>`}
      <button type="button" class="btn" data-act="fechar">Cancelar</button><button class="btn primario" type="submit">${novo ? 'Salvar dívida' : 'Salvar alterações'}</button></footer></form>`);
}
ACTS.novaDivida = () => formDivida(null);
ACTS.editarDivida = ({ id }) => formDivida(S.dividas.find(d => d.id === id));
FORMS.divida = async (fd, form) => {
  const id = form.dataset.id;
  if (!fd.credor.trim()) return 'Informe o credor.';
  const saldoDev = parseValor(fd.saldo_devedor);
  if (!(saldoDev >= 0)) return 'Informe o saldo devedor.';
  const opt = v => { const n = parseValor(v); return isFinite(n) && n > 0 ? r2(n) : null; };
  const int = v => { const n = parseInt(v, 10); return isFinite(n) && n >= 0 ? n : null; };
  const taxa = parseValor(fd.taxa_juros_mensal || '0');
  if (!isFinite(taxa) || taxa < 0 || taxa > 30) return 'A taxa de juros mensal precisa estar entre 0 e 30%.';
  const dia = int(fd.dia_vencimento);
  const reg = { credor: fd.credor.trim(), tipo: fd.tipo, descricao: (fd.descricao || '').trim() || null, saldo_devedor: r2(saldoDev), valor_original: opt(fd.valor_original),
    valor_parcela: opt(fd.valor_parcela), taxa_juros_mensal: Math.round(taxa * 10000) / 10000, parcelas_total: int(fd.parcelas_total) || null, parcelas_pagas: int(fd.parcelas_pagas) || 0,
    dia_vencimento: dia >= 1 && dia <= 31 ? dia : null, conta_id: fd.conta_id || null, esfera: fd.esfera, data_inicio: fd.data_inicio || null, observacao: (fd.observacao || '').trim() || null };
  if (id) { reg.ativa = !!form.querySelector('[name=ativa]').checked; await q(sb.from('fin_dividas').update(reg).eq('id', id)); }
  else await q(sb.from('fin_dividas').insert(reg));
  fechar(); toast(id ? 'Dívida atualizada' : 'Dívida cadastrada'); await recarregar();
};
ACTS.pagarParcela = ({ id }) => {
  const d = S.dividas.find(x => x.id === id), r = (Number(d.taxa_juros_mensal) || 0) / 100, pmt = Number(d.valor_parcela) || 0;
  const novo = Math.max(0, r2(Number(d.saldo_devedor) * (1 + r) - pmt));

function projecao(){
  const h = hoje(), mAtual = mesDe(h);
  const pend = pendentes();
  const restanteMes = pend.filter(c => mesDe(c.vencimento) <= mAtual).reduce((a, c) => a + +c.valor, 0);
  const futuros = [1, 2, 3].map(i => mesAdd(mAtual, i));
  const fim = mesAdd(mAtual, 4) + '-01';
  // contas a pagar cadastradas + repetições futuras das recorrentes
  const contas = Object.fromEntries(futuros.map(m => [m, 0]));
  for (const c of pend) {
    const passo = c.recorrencia === 'mensal' ? 1 : c.recorrencia === 'anual' ? 12 : 0;
    let v = c.vencimento, k = 0;
    while (v < fim && k < 60) { const m = mesDe(v); if (m in contas) contas[m] += +c.valor; if (!passo) break; v = addMeses(c.vencimento, passo * ++k); }
  }
  const crPend = aReceber();
  const receberMes = crPend.filter(c => c.previsao && mesDe(c.previsao) <= mAtual).reduce((a, c) => a + +c.valor, 0);
  const semData = crPend.filter(c => !c.previsao).reduce((a, c) => a + +c.valor, 0);
  const receber = Object.fromEntries(futuros.map(m => [m, 0]));
  for (const c of crPend) if (c.previsao && mesDe(c.previsao) in receber) receber[mesDe(c.previsao)] += +c.valor;
  const parc = Object.fromEntries(futuros.map(m => [m, 0]));
  for (const d of S.dividas.filter(x => x.ativa && Number(x.valor_parcela) > 0)) {
    const rest = parcelasRestantes(d); const prim = mesDe(proxVencDivida(d));
    for (let i = 0; i < rest; i++) { const m = mesAdd(prim, i); if (m in parc) parc[m] += +d.valor_parcela; if (m >= futuros[2]) break; }
  }
  // médias dos últimos 3 meses completos
  const ult3 = [1, 2, 3].map(i => mesAdd(mAtual, -i));
  const nos = ult3.map(m => S.lancs.filter(l => mesDe(l.data) === m));
  const comDados = nos.filter(a => a.length).length;
  const recMed = comDados ? nos.flat().filter(l => l.tipo === 'receita').reduce((a, l) => a + +l.valor, 0) / comDados : null;
  const diaMed = comDados ? nos.flat().filter(l => l.tipo === 'despesa' && !l.conta_pagar_id && !l.divida_id).reduce((a, l) => a + +l.valor, 0) / comDados : null;
  const linhas = futuros.map(m => { const comp = contas[m] + parc[m]; return { m, contas: contas[m], parc: parc[m], rec: receber[m], comp, saldo: recMed !== null ? recMed + receber[m] - comp - diaMed : null }; });
  return `<section class="card secao"><div class="card-cab"><h2>Próximos 3 meses</h2></div><div class="card-corpo">
    <p class="muted" style="margin:0 0 10px;font-size:14px">${restanteMes ? `Ainda neste mês: ${money(restanteMes)} em contas pendentes${pend.some(c => c.vencimento < h) ? ', incluindo vencidas' : ''}. ` : ''}${receberMes ? `A receber ainda neste mês: ${money(receberMes)}. ` : ''}Compromissos já cadastrados${recMed !== null ? `, mais a média dos últimos ${comDados === 1 ? 'mês' : comDados + ' meses'} de receitas e gastos do dia a dia` : ''}.</p>
    <div class="rolavel"><table class="tab"><thead><tr><th>Mês</th><th class="n">Contas a pagar</th><th class="n">Parcelas de dívidas</th><th class="n">A receber</th>${recMed !== null ? '<th class="n">Gastos do dia a dia</th><th class="n">Receita média</th><th class="n">Deve sobrar</th>' : ''}</tr></thead><tbody>
    ${linhas.map(x => `<tr><td>${nomeMes(x.m)}</td><td class="n">${money(x.contas)}</td><td class="n">${money(x.parc)}</td><td class="n pos">${money(x.rec)}</td>${recMed !== null ? `<td class="n">${money(diaMed)}</td><td class="n">${money(recMed)}</td><td class="n ${x.saldo < 0 ? 'neg' : 'pos'}"><b>${money(x.saldo)}</b></td>` : ''}</tr>`).join('')}
    </tbody></table></div>
    ${semData ? `<p class="muted" style="font-size:13.5px;margin:10px 0 0">Mais ${money(semData)} a receber sem data prevista ficam fora da tabela. <a href="#receber">Informe a previsão</a> para entrarem na conta.</p>` : ''}
    ${recMed === null ? '<p class="muted" style="font-size:13.5px;margin:10px 0 0">Com um ou dois meses de lançamentos, esta tabela passa a estimar quanto deve sobrar em cada mês.</p>' : '<p class="muted" style="font-size:13px;margin:10px 0 0">Gastos do dia a dia são as despesas que não vieram de contas a pagar nem de parcelas. Se uma parcela também estiver cadastrada como conta a pagar, ela aparece nas duas colunas.</p>'}
  </div></section>`;
}
function passoBonito(v){ if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); for (const f of [1, 2, 2.5, 5, 10]) if (f * p >= v) return f * p; return 10 * p; }
function desenharBarras(el, dados){
  if (!el) return;
  const W = Math.max(280, el.clientWidth), H = el.clientHeight || 250, m = { t: 10, r: 6, b: 26, l: 52 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const maxV = Math.max(...dados.map(d => Math.max(d.rec, d.desp)), 1);
  const passoY = passoBonito(maxV / 4), nTicks = Math.max(1, Math.ceil(maxV / passoY)), topo = passoY * nTicks;
  const gw = iw / dados.length, bw = Math.max(4, Math.min(30, (gw * 0.68 - 2) / 2));
  const y = v => m.t + ih - (v / topo) * ih;
  const barra = (x, v, cor) => { const hh = (v / topo) * ih; if (hh < 0.5) return ''; const r = Math.min(4, bw / 2, hh); const yy = m.t + ih - hh;
    return `<path d="M${x},${m.t + ih} V${yy + r} Q${x},${yy} ${x + r},${yy} H${x + bw - r} Q${x + bw},${yy} ${x + bw},${yy + r} V${m.t + ih} Z" fill="${cor}"/>`; };
  let s = '';
  for (let i = 0; i <= nTicks; i++) { const v = passoY * i, yy = Math.round(y(v)) + .5; s += `<line class="${i ? 'grade' : 'base'}" x1="${m.l}" x2="${W - m.r}" y1="${yy}" y2="${yy}"/><text class="eixo" x="${m.l - 8}" y="${yy + 4}" text-anchor="end">${i ? curto(v) : '0'}</text>`; }
  const passo = dados.length > 8 && W < 520 ? 2 : 1;
  dados.forEach((d, i) => {
    const x0 = m.l + gw * i + (gw - (bw * 2 + 2)) / 2;
    s += barra(x0, d.rec, 'var(--rec)') + barra(x0 + bw + 2, d.desp, 'var(--desp)');
    if (i % passo === 0 || i === dados.length - 1) s += `<text class="eixo" x="${m.l + gw * i + gw / 2}" y="${H - 7}" text-anchor="middle">${nomeMesCurto(d.m)}</text>`;
    s += `<rect x="${m.l + gw * i}" y="${m.t}" width="${gw}" height="${ih}" fill="transparent" data-i="${i}"/>`;
  });
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Receitas e despesas por mês">${s}</svg><div class="dica" aria-hidden="true"></div>`;
  const dica = el.querySelector('.dica'), svg = el.querySelector('svg');
  const mostrar = ev => {
    const t = ev.target.closest('rect[data-i]'); if (!t) return esconder();
    const d = dados[+t.dataset.i];
    dica.innerHTML = `<b>${nomeMes(d.m)}</b><div><span><i style="background:var(--rec)"></i>Receitas</span><span class="money">${brl(d.rec)}</span></div><div><span><i style="background:var(--desp)"></i>Despesas</span><span class="money">${brl(d.desp)}</span></div><div style="margin-top:4px;border-top:1px solid rgba(255,255,255,.2);padding-top:4px"><span>Resultado</span><span class="money">${brl(d.res)}</span></div>`;
    const r = el.getBoundingClientRect(); let x = ev.clientX - r.left + 14; const yy = Math.max(0, ev.clientY - r.top - 40);
    dica.classList.add('vis'); if (x + dica.offsetWidth > r.width) x = ev.clientX - r.left - dica.offsetWidth - 14;
    dica.style.left = Math.max(0, x) + 'px'; dica.style.top = yy + 'px';
    svg.querySelectorAll('rect[data-i]').forEach(rr => rr.setAttribute('fill', rr === t ? 'rgba(127,150,170,.10)' : 'transparent'));
  };
  const esconder = () => { dica.classList.remove('vis'); svg.querySelectorAll('rect[data-i]').forEach(rr => rr.setAttribute('fill', 'transparent')); };
  svg.addEventListener('pointermove', mostrar); svg.addEventListener('pointerdown', mostrar); svg.addEventListener('pointerleave', esconder);
}

function desenharBarrasLego(el, dados){
  if (!el) return;
  const W = Math.max(280, el.clientWidth), H = el.clientHeight || 240, m = { t: 10, r: 6, b: 26, l: 52 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const maxV = Math.max(...dados.map(d => d.conf + d.prov), 1);
  const passoY = passoBonito(maxV / 4), nTicks = Math.max(1, Math.ceil(maxV / passoY)), topo = passoY * nTicks;
  const gw = iw / dados.length, bw = Math.max(6, Math.min(34, gw * 0.62));
  const y = v => m.t + ih - (v / topo) * ih;
  const pedaco = (x, y0, y1, arred, extra) => { const hh = y1 - y0; if (hh < 0.5) return ''; const r = arred ? Math.min(4, bw / 2, hh) : 0;
    return `<path d="M${x},${y1} V${y0 + r} Q${x},${y0} ${x + r},${y0} H${x + bw - r} Q${x + bw},${y0} ${x + bw},${y0 + r} V${y1} Z" fill="var(--desp)" ${extra}/>`; };
  let s = '';
  for (let i = 0; i <= nTicks; i++) { const v = passoY * i, yy = Math.round(y(v)) + .5; s += `<line class="${i ? 'grade' : 'base'}" x1="${m.l}" x2="${W - m.r}" y1="${yy}" y2="${yy}"/><text class="eixo" x="${m.l - 8}" y="${yy + 4}" text-anchor="end">${i ? curto(v) : '0'}</text>`; }
  const passo = dados.length > 8 && W < 560 ? 2 : 1;
  dados.forEach((d, i) => {
    const x = m.l + gw * i + (gw - bw) / 2, yc = y(d.conf), yt = y(d.conf + d.prov), base = m.t + ih;
    s += pedaco(x, yc, base, d.prov <= 0, '');
    if (d.prov > 0) s += pedaco(x, yt, d.conf > 0 ? yc - 1 : base, true, 'fill-opacity=".4"');
    if (i % passo === 0 || i === dados.length - 1) s += `<text class="eixo" x="${m.l + gw * i + gw / 2}" y="${H - 7}" text-anchor="middle">${nomeMesCurto(d.m)}</text>`;
    s += `<rect x="${m.l + gw * i}" y="${m.t}" width="${gw}" height="${ih}" fill="transparent" data-i="${i}"/>`;
  });
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Gasto com LEGO por mês">${s}</svg><div class="dica" aria-hidden="true"></div>`;
  const dica = el.querySelector('.dica'), svg = el.querySelector('svg');
  const esconder = () => { dica.classList.remove('vis'); svg.querySelectorAll('rect[data-i]').forEach(rr => rr.setAttribute('fill', 'transparent')); };
  const mostrar = ev => {
    const t = ev.target.closest('rect[data-i]'); if (!t) return esconder();
    const d = dados[+t.dataset.i];
    dica.innerHTML = `<b>${nomeMes(d.m)}</b><div><span><i style="background:var(--desp)"></i>Confirmado</span><span class="money">${brl(d.conf)}</span></div><div><span><i style="background:var(--desp);opacity:.4"></i>Provável</span><span class="money">${brl(d.prov)}</span></div><div style="margin-top:4px;border-top:1px solid rgba(255,255,255,.2);padding-top:4px"><span>Total, ${d.n} compra${d.n === 1 ? '' : 's'}</span><span class="money">${brl(d.conf + d.prov)}</span></div>`;
    const r = el.getBoundingClientRect(); let x = ev.clientX - r.left + 14; const yy = Math.max(0, ev.clientY - r.top - 40);
    dica.classList.add('vis'); if (x + dica.offsetWidth > r.width) x = ev.clientX - r.left - dica.offsetWidth - 14;
    dica.style.left = Math.max(0, x) + 'px'; dica.style.top = yy + 'px';
    svg.querySelectorAll('rect[data-i]').forEach(rr => rr.setAttribute('fill', rr === t ? 'rgba(127,150,170,.10)' : 'transparent'));
  };
  svg.addEventListener('pointermove', mostrar); svg.addEventListener('pointerdown', mostrar); svg.addEventListener('pointerleave', esconder);
}
